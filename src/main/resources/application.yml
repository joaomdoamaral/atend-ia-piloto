server:
  port: ${PORT:8080}

spring:
  application:
    name: atend-ia-piloto

agenda:
  calendar-id: ${AGENDA_CALENDAR_ID:patrick@psvarejo.com.br}
  credentials-path: ${AGENDA_CREDENTIALS_PATH:/home/claude/atend-ia-piloto/credentials/service-account.json}
  timezone: ${AGENDA_TIMEZONE:America/Sao_Paulo}
  business-hour-start: ${AGENDA_BUSINESS_HOUR_START:09:00}
  business-hour-end: ${AGENDA_BUSINESS_HOUR_END:18:00}
  slot-duration-minutes: ${AGENDA_SLOT_DURATION_MINUTES:30}
  max-slots-returned: ${AGENDA_MAX_SLOTS_RETURNED:5}
  max-days-ahead: ${AGENDA_MAX_DAYS_AHEAD:30}
  vapi-webhook-secret: ${AGENDA_VAPI_WEBHOOK_SECRET:}

logging:
  level:
    br.com.psvarejo.atendia: INFO
