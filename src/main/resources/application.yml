server:
  port: ${PORT:8080}

spring:
  application:
    name: atend-ia-piloto
  config:
    # Para desenvolvimento local: le variaveis do arquivo .env (fora do Git), se existir.
    # Em producao, use variaveis de ambiente de verdade.
    import: optional:file:.env[.properties]

agenda:
  cal-api-key: ${CAL_API_KEY:}
  cal-base-url: ${CAL_BASE_URL:https://api.cal.com/v2}
  cal-event-type-id: ${CAL_EVENT_TYPE_ID:}
  timezone: ${AGENDA_TIMEZONE:America/Sao_Paulo}
  max-slots-returned: ${AGENDA_MAX_SLOTS_RETURNED:5}
  max-slots-per-day: ${AGENDA_MAX_SLOTS_PER_DAY:2}
  max-days-ahead: ${AGENDA_MAX_DAYS_AHEAD:30}
  vapi-webhook-secret: ${AGENDA_VAPI_WEBHOOK_SECRET:}

demo:
  vapi-public-key: ${VAPI_PUBLIC_KEY:}
  vapi-assistant-id: ${VAPI_ASSISTANT_ID:}

logging:
  level:
    br.com.psvarejo.atendia: INFO
